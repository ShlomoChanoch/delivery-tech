# ===================================================================
# DOCKER COMPOSE - DELIVERY API + MYSQL 8.4 + ADMINER
# ===================================================================

services:
  # ===================================================================
  # MYSQL 8.4 - Banco de Dados Relacional (homologação / produção)
  # ===================================================================
  mysql:
    image: docker.io/library/mysql:8.4
    container_name: delivery-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-delivery}
      MYSQL_USER: ${MYSQL_USER:-delivery}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-delivery_local_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - delivery-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ===================================================================
  # DELIVERY API - Aplicação Principal
  # ===================================================================
  delivery-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delivery-api
    user: root
    ports:
      - "8080:8080"    # Host:Container
    environment:
      # Profile de produção/homologação (MySQL 8.4, H2 console desligado, logging INFO)
      SPRING_PROFILES_ACTIVE: prod

      # Configurações JVM
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:+UseContainerSupport"

      # Configurações da aplicação
      SERVER_PORT: 8080

      # Banco MySQL 8.4
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-delivery}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-delivery}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-delivery_local_pass}

      # JPA/Hibernate
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: false

      # JWT — obrigatório: defina JWT_SECRET no .env (Base64URL, >= 32 bytes).
      # Gere com: openssl rand -base64 32 | tr '+/' '-_' | tr -d '='
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env — veja .env.example}
      JWT_EXPIRATION: 86400000

    volumes:
      # Persistir logs
      - app_logs:/app/logs

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - delivery-network

    restart: unless-stopped

    healthcheck:
      # Distroless não tem shell/wget/curl: a sonda é o HealthCheck.class
      # compilado no estágio de build do Dockerfile (docker/HealthCheck.java).
      test: ["CMD", "/usr/bin/java", "-Xmx64m", "-cp", "/app/health", "HealthCheck", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ===================================================================
  # ADMINER - Interface Web para o MySQL
  # ===================================================================
  adminer:
    image: adminer:latest
    container_name: delivery-adminer
    ports:
      - "8083:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    networks:
      - delivery-network
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

# ===================================================================
# VOLUMES PERSISTENTES
# ===================================================================
volumes:
  mysql_data:
    driver: local
    name: delivery_mysql_data
  app_logs:
    driver: local
    name: delivery_logs

# ===================================================================
# REDE CUSTOMIZADA
# ===================================================================
networks:
  delivery-network:
    driver: bridge
    name: delivery_network
