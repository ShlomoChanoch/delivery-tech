# ===== CONFIGURAÇÃO H2 DATABASE =====
spring.datasource.url=jdbc:h2:mem:delivery
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== H2 CONSOLE =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA/Hibernate (dialeto detectado automaticamente pelo driver JDBC: H2 em dev/test, MySQL em prod)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuracoes de desenvolvimento
spring.devtools.restart.enabled=true

# Thymeleaf: sem cache em dev para editar template sem reiniciar
spring.thymeleaf.cache=false

# Configuracoes especificas para JDK 21
spring.jpa.open-in-view=false
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.jdbc.datasource.init=DEBUG

# Executar scripts SQL automaticamente
# spring.sql.init.mode=always
# spring.sql.init.data-locations=classpath:data.sql
# spring.sql.init.schema-locations=classpath:schema.sql

# Configuracao customizada do swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# JWT Configuration — o segredo vem SEMPRE do ambiente (JWT_SECRET), nunca hardcoded.
# Gere um valor Base64URL de >= 32 bytes: openssl rand -base64 32 | tr '+/' '-_' | tr -d '='
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Security Configuration - APENAS UMA CONFIGURAÇÃO
spring.security.user.name=admin
spring.security.user.password=admin

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.deliverytech=DEBUG
logging.level.web=DEBUG
logging.level.io.micrometer=DEBUG
logging.level.root=INFO
 
# Cache Caffeine (estatísticas exportadas para Micrometer/Actuator)
spring.cache.type=caffeine
spring.cache.cache-names=relatorioVendasPorRestaurante,relatorioProdutosMaisVendidos,relatorioClientesAtivos,relatorioPedidosPorPeriodo,relatorioResumoVendas
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=5m,recordStats

# Rate limiting em /api/auth/** (proteção contra força bruta por IP)
app.rate-limit.auth.enabled=true
app.rate-limit.auth.max-requests=20
app.rate-limit.auth.window-seconds=60

# Configurações do Actuator e Métricas
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.endpoint.info.enabled=true
management.info.env.enabled=true
management.info.java.enabled=true
management.metrics.web.server.request.autotime.enabled=false
management.metrics.web.server.request.timed.enabled=true
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.info.git.enabled=true
management.info.git.mode=full

# Informações da Aplicação (para /actuator/info)
info.app.name=DeliveryTech API
info.app.description=API de entrega com monitoramento
info.app.version=1.0.0
info.custom.feature-status=Paginação, Cache e Health Checks habilitados
info.custom.last-deployment-date=2025-07-23
info.custom.contact-email=suporte@deliverytech.com