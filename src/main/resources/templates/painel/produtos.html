<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: content('Produtos', 'produtos', ~{:: main})}">
<body>
<main>
    <div class="card painel-card">
        <div class="card-header painel-card-header d-flex flex-wrap align-items-center gap-2">
            <span>Produtos</span>
            <div class="d-flex flex-wrap gap-1 ms-auto">
                <a class="badge painel-chip"
                   th:classappend="${categoria == '' ? 'active' : ''}"
                   th:href="@{/painel/produtos}">Todas</a>
                <a class="badge painel-chip" th:each="c : ${categorias}"
                   th:classappend="${categoria == c ? 'active' : ''}"
                   th:href="@{/painel/produtos(categoria=${c})}" th:text="${c}">Categoria</a>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Nome</th>
                    <th scope="col">Categoria</th>
                    <th scope="col" class="text-end">Preço</th>
                    <th scope="col">Restaurante</th>
                    <th scope="col">Disponível</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="produto : ${produtos}">
                    <td th:text="${produto.id}">1</td>
                    <td>
                        <span th:text="${produto.nome}">Produto</span>
                        <div class="small text-muted" th:text="${produto.descricao}">Descrição</div>
                    </td>
                    <td>
                        <span class="badge painel-chip" th:text="${produto.categoria}">Categoria</span>
                    </td>
                    <td class="text-end text-nowrap"
                        th:text="'R$ ' + ${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}">
                        R$ 0,00
                    </td>
                    <td th:text="${produto.restaurante != null ? produto.restaurante.nome : '—'}">
                        Restaurante
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${produto.ativo ? 'text-bg-success' : 'text-bg-secondary'}"
                              th:text="${produto.ativo ? 'Sim' : 'Não'}">Sim</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(produtos)}">
                    <td class="text-center text-muted py-4" colspan="6">
                        Nenhum produto nesta categoria.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small">
            <span th:text="${#lists.size(produtos)}">0</span> produto(s)
            <span th:if="${categoria != ''}">
                — filtro: <code th:text="'?categoria=' + ${categoria}">?categoria=</code>
            </span>
        </div>
    </div>
</main>
</body>
</html>
