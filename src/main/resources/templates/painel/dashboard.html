<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: content('Dashboard', 'dashboard', ~{:: main})}">
<body>
<main>
    <div class="row g-3 mb-4">
        <div class="col-sm-6 col-xl-3">
            <div class="card painel-card h-100">
                <div class="painel-card-label">Pedidos</div>
                <div class="painel-card-value" th:text="${resumo['totalPedidos']}">0</div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card painel-card h-100">
                <div class="painel-card-label">Vendas (total)</div>
                <div class="painel-card-value"
                     th:text="'R$ ' + ${#numbers.formatDecimal(resumo['valorTotalVendas'], 1, 'POINT', 2, 'COMMA')}">
                    R$ 0,00
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card painel-card h-100">
                <div class="painel-card-label">Ticket médio</div>
                <div class="painel-card-value"
                     th:text="'R$ ' + ${#numbers.formatDecimal(resumo['ticketMedio'], 1, 'POINT', 2, 'COMMA')}">
                    R$ 0,00
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card painel-card h-100">
                <div class="painel-card-label">Clientes ativos</div>
                <div class="painel-card-value" th:text="${resumo['clientesAtivos']}">0</div>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-7">
            <div class="card painel-card">
                <div class="card-header painel-card-header">
                    Pedidos no período
                    <span class="text-muted small"
                          th:text="'últimos ' + ${periodoDias} + ' dias'"></span>
                </div>
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-5">Período</dt>
                        <dd class="col-7" th:text="${pedidosPeriodo['periodo']}">—</dd>
                        <dt class="col-5">Total de pedidos</dt>
                        <dd class="col-7" th:text="${pedidosPeriodo['totalPedidos']}">0</dd>
                        <dt class="col-5">Valor total</dt>
                        <dd class="col-7"
                            th:text="'R$ ' + ${#numbers.formatDecimal(pedidosPeriodo['valorTotal'], 1, 'POINT', 2, 'COMMA')}">
                            R$ 0,00
                        </dd>
                        <dt class="col-5">Agrupamento</dt>
                        <dd class="col-7" th:text="${pedidosPeriodo['agrupamento']}">dia</dd>
                    </dl>
                </div>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="card painel-card h-100">
                <div class="card-header painel-card-header">Restaurantes ativos</div>
                <div class="card-body d-flex align-items-center">
                    <div class="painel-card-value me-3"
                         th:text="${resumo['restaurantesAtivos']}">0
                    </div>
                    <span class="text-muted">restaurantes cadastrados e ativos na base</span>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
