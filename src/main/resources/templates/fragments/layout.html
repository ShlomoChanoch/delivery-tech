<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="content(titulo, ativo, pagina)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Painel DeliveryTech — ' + ${titulo}">Painel DeliveryTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link th:href="@{/css/painel.css}" rel="stylesheet">
</head>
<body>
<div class="painel">
    <aside class="painel-sidebar">
        <a class="painel-brand" th:href="@{/painel}">Delivery<span>Tech</span></a>
        <nav>
            <a class="painel-nav" th:classappend="${ativo == 'dashboard' ? 'active' : ''}"
               th:href="@{/painel}">Dashboard</a>
            <a class="painel-nav" th:classappend="${ativo == 'clientes' ? 'active' : ''}"
               th:href="@{/painel/clientes}">Clientes</a>
            <a class="painel-nav" th:classappend="${ativo == 'produtos' ? 'active' : ''}"
               th:href="@{/painel/produtos}">Produtos</a>
            <a class="painel-nav" th:classappend="${ativo == 'pedidos' ? 'active' : ''}"
               th:href="@{/painel/pedidos}">Pedidos</a>
            <a class="painel-nav" th:classappend="${ativo == 'relatorios' ? 'active' : ''}"
               th:href="@{/painel/relatorios}">Relatórios</a>
        </nav>
        <div class="painel-sidebar-foot">
            <a th:href="@{/swagger-ui/index.html}" target="_blank">API Swagger ↗</a>
        </div>
    </aside>

    <div class="painel-main">
        <header class="painel-topbar">
            <h1 th:text="${titulo}">Painel</h1>
            <span class="painel-badge">acesso público</span>
        </header>

        <main class="painel-content">
            <th:block th:replace="${pagina}"/>
        </main>
    </div>
</div>
</body>
</html>
