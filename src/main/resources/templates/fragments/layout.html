<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="pt-BR"
      th:fragment="content(titulo, ativo, pagina)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Painel DeliveryTech — ' + ${titulo}">Painel DeliveryTech</title>
    <link rel="icon"
          href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f2937'/%3E%3Ctext x='16' y='23' font-family='sans-serif' font-size='20' font-weight='bold' fill='%23f97316' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link th:href="@{/css/painel.css}" rel="stylesheet">
</head>
<body>
<a class="painel-skip" href="#conteudo">Pular para o conteúdo</a>

<div class="painel">
    <aside class="painel-sidebar">
        <a class="painel-brand" th:href="@{/painel}">Delivery<span>Tech</span></a>
        <nav aria-label="Navegação do painel">
            <a class="painel-nav" th:aria-current="${ativo == 'dashboard' ? 'page' : null}"
               th:classappend="${ativo == 'dashboard' ? 'active' : ''}"
               th:href="@{/painel}">Dashboard</a>
            <a class="painel-nav" th:aria-current="${ativo == 'clientes' ? 'page' : null}"
               th:classappend="${ativo == 'clientes' ? 'active' : ''}"
               th:href="@{/painel/clientes}">Clientes</a>
            <a class="painel-nav" th:aria-current="${ativo == 'produtos' ? 'page' : null}"
               th:classappend="${ativo == 'produtos' ? 'active' : ''}"
               th:href="@{/painel/produtos}">Produtos</a>
            <a class="painel-nav" th:aria-current="${ativo == 'pedidos' ? 'page' : null}"
               th:classappend="${ativo == 'pedidos' ? 'active' : ''}"
               th:href="@{/painel/pedidos}">Pedidos</a>
            <a class="painel-nav" th:aria-current="${ativo == 'relatorios' ? 'page' : null}"
               th:classappend="${ativo == 'relatorios' ? 'active' : ''}"
               th:href="@{/painel/relatorios}">Relatórios</a>
        </nav>
        <div class="painel-sidebar-foot">
            <a th:href="@{/swagger-ui/index.html}" target="_blank" rel="noopener">API Swagger ↗</a>
        </div>
    </aside>

    <div class="painel-main">
        <header class="painel-topbar">
            <h1 th:text="${titulo}">Painel</h1>
            <span class="painel-badge">acesso público</span>
        </header>

        <div class="painel-content" id="conteudo" tabindex="-1">
            <th:block th:replace="${pagina}"/>
        </div>
    </div>
</div>
</body>
</html>
