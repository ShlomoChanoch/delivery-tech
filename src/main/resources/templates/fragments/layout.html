<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="pt-BR"
      data-bs-theme="dark"
      th:fragment="content(titulo, ativo, pagina)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Painel DeliveryTech — ' + ${titulo}">Painel DeliveryTech</title>
    <link rel="icon"
          href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f2937'/%3E%3Ctext x='16' y='23' font-family='sans-serif' font-size='20' font-weight='bold' fill='%23f97316' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link th:href="@{/css/painel.css}" rel="stylesheet">
</head>
<body>
<a class="painel-skip" href="#conteudo">Pular para o conteúdo</a>

<div class="painel">
    <aside class="painel-sidebar">
        <a class="painel-brand" th:href="@{/painel}">
            <span class="painel-brand-mark" aria-hidden="true">D</span>
            <span>Delivery<span class="painel-brand-accent">Tech</span></span>
        </a>

        <nav class="painel-nav" aria-label="Navegação do painel">
            <span class="painel-nav-label">Painel</span>

            <a class="painel-nav-link"
               th:aria-current="${ativo == 'dashboard' ? 'page' : null}"
               th:classappend="${ativo == 'dashboard' ? 'active' : ''}"
               th:href="@{/painel}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="3" width="7" height="9" rx="1.5"/>
                    <rect x="14" y="3" width="7" height="5" rx="1.5"/>
                    <rect x="14" y="12" width="7" height="9" rx="1.5"/>
                    <rect x="3" y="16" width="7" height="5" rx="1.5"/>
                </svg>
                Dashboard
            </a>

            <a class="painel-nav-link"
               th:aria-current="${ativo == 'clientes' ? 'page' : null}"
               th:classappend="${ativo == 'clientes' ? 'active' : ''}"
               th:href="@{/painel/clientes}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                Clientes
            </a>

            <a class="painel-nav-link"
               th:aria-current="${ativo == 'produtos' ? 'page' : null}"
               th:classappend="${ativo == 'produtos' ? 'active' : ''}"
               th:href="@{/painel/produtos}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/>
                    <path d="M7 2v20"/>
                    <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Z"/>
                    <path d="M21 15v7"/>
                </svg>
                Produtos
            </a>

            <a class="painel-nav-link"
               th:aria-current="${ativo == 'pedidos' ? 'page' : null}"
               th:classappend="${ativo == 'pedidos' ? 'active' : ''}"
               th:href="@{/painel/pedidos}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/>
                    <path d="M8 8h8"/>
                    <path d="M8 12h8"/>
                    <path d="M8 16h5"/>
                </svg>
                Pedidos
            </a>

            <a class="painel-nav-link"
               th:aria-current="${ativo == 'relatorios' ? 'page' : null}"
               th:classappend="${ativo == 'relatorios' ? 'active' : ''}"
               th:href="@{/painel/relatorios}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 3v18h18"/>
                    <path d="M18 17V9"/>
                    <path d="M13 17V5"/>
                    <path d="M8 17v-3"/>
                </svg>
                Relatórios
            </a>
        </nav>

        <div class="painel-sidebar-foot">
            <span>DeliveryTech · demonstração</span>
            <a th:href="@{/swagger-ui/index.html}" target="_blank" rel="noopener">
                API Swagger
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M15 3h6v6"/>
                    <path d="M10 14 21 3"/>
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                </svg>
            </a>
        </div>
    </aside>

    <div class="painel-main">
        <header class="painel-topbar">
            <div>
                <h1 th:text="${titulo}">Painel</h1>
                <p class="painel-crumb">
                    Painel <span aria-hidden="true">/</span> <strong th:text="${titulo}">Dashboard</strong>
                </p>
            </div>
            <span class="painel-badge">acesso público</span>
        </header>

        <div class="painel-content" id="conteudo" tabindex="-1">
            <th:block th:replace="${pagina}"/>
        </div>
    </div>
</div>
</body>
</html>
