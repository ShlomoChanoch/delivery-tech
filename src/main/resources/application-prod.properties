# ===================================================================
# CONFIGURAÇÃO DE HOMOLOGAÇÃO / PRODUÇÃO — MYSQL 8.4
# Ative com: SPRING_PROFILES_ACTIVE=prod
# ===================================================================

# DataSource MySQL 8.4 (valores vêm do ambiente / docker-compose)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/delivery?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:delivery}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA/Hibernate (dialeto MySQL 8 detectado automaticamente pelo Hibernate 6)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Desabilitar ferramentas exclusivas de desenvolvimento
spring.h2.console.enabled=false
spring.devtools.restart.enabled=false
spring.thymeleaf.cache=true

# Logging enxuto para homologação/produção (evita S4507 / DEBUG em prod)
logging.level.root=INFO
logging.level.com.deliverytech=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.jdbc.datasource.init=INFO
logging.level.web=INFO
logging.level.io.micrometer=INFO
